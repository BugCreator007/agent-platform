name: ci

# 后端测试 + 两个前端构建；PR 与主分支推送都会触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn -q test

  admin-web:
    name: admin-web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web

  user-web:
    name: user-web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: user-web
      - run: npm run build
        working-directory: user-web
