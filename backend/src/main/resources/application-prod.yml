server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true

app:
  demo:
    seed: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.example.com}
  security:
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
    jwt:
      secret: ${JWT_SECRET}
      expires-minutes: ${JWT_EXPIRES_MINUTES:480}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${EMBEDDING_DIMENSION:384}
  vector:
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      url: ${MILVUS_URL}
      collection: ${MILVUS_COLLECTION:agent_chunks}
      dimension: ${EMBEDDING_DIMENSION:384}
      token: ${MILVUS_TOKEN:}
  search:
    elasticsearch:
      enabled: ${ES_ENABLED:true}
      url: ${ES_URL}
      index: ${ES_INDEX:agent_chunks}
  storage:
    type: ${STORAGE_TYPE:cos}
    cos:
      secret-id: ${COS_SECRET_ID}
      secret-key: ${COS_SECRET_KEY}
      region: ${COS_REGION}
      bucket: ${COS_BUCKET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
