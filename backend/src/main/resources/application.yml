server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: agent-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/agent_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:agent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    visibility:
      field: any

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: agent-backend

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo:
    seed: ${DEMO_SEED:true}
  ai:
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${EMBEDDING_DIMENSION:384}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
  security:
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
    jwt:
      secret: ${JWT_SECRET:agent-platform-local-dev-secret-change-me-32b}
      expires-minutes: ${JWT_EXPIRES_MINUTES:480}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}

  vector:
    milvus:
      enabled: ${MILVUS_ENABLED:false}
      url: ${MILVUS_URL:http://localhost:19530}
      collection: ${MILVUS_COLLECTION:agent_chunks}
      dimension: ${EMBEDDING_DIMENSION:384}
      token: ${MILVUS_TOKEN:}
  search:
    elasticsearch:
      enabled: ${ES_ENABLED:false}
      url: ${ES_URL:http://localhost:9200}
      index: ${ES_INDEX:agent_chunks}
  knowledge:
    web:
      allow-private: ${ALLOW_PRIVATE_WEB:false}
  workflow:
    max-attempts: ${WORKFLOW_MAX_ATTEMPTS:2}
    scheduler:
      enabled: ${WORKFLOW_SCHEDULER_ENABLED:false}
      interval-ms: ${WORKFLOW_SCHEDULER_INTERVAL_MS:60000}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/files}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-shanghai}
      bucket: ${COS_BUCKET:}
