# 测试环境：H2 MySQL 兼容模式 + Flyway 迁移，保证与生产表结构一致
spring:
  datasource:
    url: jdbc:h2:mem:agent_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  demo:
    seed: true
