apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-frontend
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: agent-frontend }
  template:
    metadata:
      labels: { app: agent-frontend }
    spec:
      containers:
        - name: frontend
          image: ccr.ccs.tencentyun.com/agent-platform/frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-frontend
  namespace: agent-platform
spec:
  selector: { app: agent-frontend }
  ports: [{ port: 80, targetPort: 80 }]
