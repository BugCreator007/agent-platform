apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-platform
  namespace: agent-platform
  annotations:
    kubernetes.io/ingress.class: qcloud
    kubernetes.io/ingress.existLbId: "lb-replace-me"
spec:
  tls:
    - hosts: ["agent.example.com"]
      secretName: agent-platform-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: agent-backend, port: { number: 8081 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: agent-frontend, port: { number: 80 } } }
