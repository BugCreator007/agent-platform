# 单机腾讯云 CVM 生产部署：MySQL + Redis + 后端 + 管理端 + 用户端
# 数据卷持久化数据库、Redis 与知识库文件；源码与密钥通过 .env 注入
name: agent-platform

services:
  # 业务库：数据落在 mysql-data 卷，低配机器限制缓冲池并关闭 performance_schema
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agent_platform
      MYSQL_USER: ${DB_USERNAME:-agent}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/server/.env 中设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 deploy/server/.env 中设置 DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Redis：登录限流与 JWT 登出黑名单，数据落在 redis-data 卷
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 后端：Spring Boot 应用，数据库时区统一 UTC，容器时区上海
  agent-backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/agent_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
      DB_USERNAME: ${DB_USERNAME:-agent}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_LOCAL_ROOT: /data/files
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-files:/data/files

  # 管理后台：Nginx 静态站点，宿主机 HTTP_PORT 映射到 80
  agent-frontend:
    build:
      context: ../../admin-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - agent-backend

  # 用户端聊天门户：Nginx 静态站点，宿主机 USER_HTTP_PORT 映射到 80
  user-web:
    build:
      context: ../../user-web
    restart: unless-stopped
    ports:
      - "${USER_HTTP_PORT:-8089}:80"
    depends_on:
      - agent-backend

volumes:
  mysql-data:
  redis-data:
  backend-files:
